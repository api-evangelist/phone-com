- aid: phone-com:phone-com-call-logs-api
  name: Phone Com Call Logs API
  description: >-
    The Call Logs API returns a list of call detail records for the account. The result includes the id,
    start time, creation time, caller ID, called number, direction of call, and duration in seconds. If
    applicable, the result may also include final action, final action duration, listen URL, and/or transcription.
    Since the call logs usually contains many calls, API users may use filters such as start_time, created_at
    and direction to limit the result set to calls interested. Users may also use the sorting parameters
    such as start_time and created_at to list result in ascending or descending order.
