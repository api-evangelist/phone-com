  name: Phone Com Listeners API
  description: >-
    [DEPRECATED; use Events Listeners] At the heart of every telephony system is the Events Engine. At
    Phone.com, our customers (and their call traffic) emit millions of events per day. These events play
    a key role in advanced integration opportunities such as CRM integration, security/auditing, and real-time
    contextual call control. The Events and Listeners API Services aim to simplify and standardize the
    method in which events are extracted from our systems and processed. These services provide consistent
    interfaces for internal systems to log events, manage subscriptions, and provide interfaces for external
    systems (e.g. customer applications or integrations such as Salesforce CRM) to subscribe to account-specific
    events and manage the subscriptions.
