aid: phone-com
name: Phone Com
description: >-
  Phone.com is a cloud business phone and unified communications provider for
  small and mid-sized businesses, offering VoIP calling, SMS/MMS, video
  conferencing, fax, and virtual phone numbers. Its developer platform is the
  JSON REST v4 API (codenamed "Phoenix") at api.phone.com, which gives
  programmatic control over accounts, extensions, devices, phone numbers, call
  routing (routes, menus, queues, schedules), media, messaging, and an event
  callback/listener webhook system. Authentication is OAuth 2.0. First-party SDKs
  are published for Go, Python, PHP, Android, and JavaScript. Surfaced as a
  portfolio company of Lightspeed Venture Partners and enriched into the API
  Evangelist network.
