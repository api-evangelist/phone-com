- aid: phone-com:phone-com-media-api
  name: Phone Com Media API
  description: >-
    Your Phone.com account has two kinds of media that can be used in various ways: Hold Music and Greetings.
    Hold Music can be used in routes, queues, and anywhere the caller might be placed on hold. Your account
    has access to a set of standard hold music options, and optionally another set of premium hold music
    options. You can also upload your own hold music, subject to copyright limitations. Greetings are
    verbal messages that can be played in various places to provide the caller with important information.
    For example, greetings are used when a caller first enters a menu or if they enter an invalid option.
    You also might use a greeting to alert the user to the fact that their call is being recorded.
