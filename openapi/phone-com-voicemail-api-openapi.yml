openapi: 3.2.0
info:
  title: Phoenix API by Phone.com Voicemail API
  description: API
  version: 4.6.11
servers:
- url: https://api.phone.com
  description: Main production server
tags:
- name: Voicemail
  description: Phone.com’s standard phone service allows callers to leave a voicemail if the incoming call was not answered. The /voicemail services show a history of voicemail and allow users to download voicemail for offline playback.
paths:
  /v4/accounts/{voip_id}/extensions/{extension_id}/voicemail:
    get:
      summary: List Voicemail for extension
      description: Get a list of voicemail messages for the extension
      tags:
      - Voicemail
      parameters:
      - name: voip_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: extension_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
        required: false
        description: The number of items to skip before starting to collect the result set
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 25
        required: false
        description: The number of items to return
      - in: query
        name: sort[id]
        description: Sort response
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      - in: query
        name: filters[is_new]
        schema:
          type: string
        required: false
        description: True when Voicemail is new; False when Voicemail has been read
      - in: query
        name: filters[from]
        schema:
          type: string
        required: false
        description: 'Caller ID filter, the E.164 phone number to send the Voicemail FROM. Note: you must encode the + as %2B'
      - in: query
        name: filters[to]
        schema:
          type: string
        required: false
        description: Callee ID filter, the E.164 phone number to send the Voicemail TO. Note you must encode the + as %2B
      - in: query
        name: filters[duration]
        schema:
          type: string
        required: false
        description: Voicemail duration
      - in: query
        name: filters[created_at]
        schema:
          type: string
        required: false
        description: 'Date string representing the UTC time that Voicemail was created. Expected value is UNIX timestamp with operator like "gt" (greater than), "gte" (greater than or equals), "lt" (lesser than), "lte" (lesser than or equals). Example: "gt:1597778180".'
      - in: query
        name: filters[updated_at]
        schema:
          type: string
        required: false
        description: 'Date string representing the UTC time that Voicemail was updated. Expected value is UNIX timestamp with operator like "gt" (greater than), "gte" (greater than or equals), "lt" (lesser than), "lte" (lesser than or equals). Example: "gt:1597778180".'
      - in: query
        name: filters[extension]
        schema:
          type: string
        required: false
        description: Extension id where Voicemail is stored
      - in: query
        name: filters[deleted]
        schema:
          type: string
        required: false
        description: only=deleted Voicemail; ignore=existing Voicemail; with=both deleted and existing Voicemail
      - in: query
        name: mode
        schema:
          type: string
          enum:
          - brief
          - full
          default: full
        required: false
        description: Defines mode of the data output (brief or full)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-Response'
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/Payment-Required'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Not-Found'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation-Error'
        '429':
          $ref: '#/components/responses/Too-Many-Requests'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
      security:
      - bearerAuth: []
      operationId: getV4AccountsByVoipIdExtensionsByExtensionIdVoicemail
      x-operation-id-source: derived
    delete:
      summary: Delete Voicemail (multiple) for extension
      description: The endpoint .../voicemail (combined with the HTTP method DELETE) allows the user to delete one or more voicemail in one shot. Be careful when using this API and pass the correct Query Params as needed.
      tags:
      - Voicemail
