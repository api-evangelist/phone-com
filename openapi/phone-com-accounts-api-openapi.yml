openapi: 3.2.0
info:
  title: Phoenix API by Phone.com Accounts API
  description: API
  version: 4.6.11
servers:
- url: https://api.phone.com
  description: Main production server
tags:
- name: Accounts
  description: This page gives an overview of how to interact with your accounts.
paths:
  /v4/accounts:
    get:
      summary: List Accounts
      description: Get a list of accounts visible to the authenticated user or client
      tags:
      - Accounts
      parameters:
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
        required: false
        description: The number of items to skip before starting to collect the result set
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 25
        required: false
        description: The number of items to return
      - in: query
        name: sort[id]
        description: Sort response
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      - in: query
        name: include_subaccounts
        schema:
          type: integer
          minimum: 0
          default: 0
        required: false
        description: Send "1" if you want to add subaccounts data into output
      - in: query
        name: filters[name]
        schema:
          type: string
        required: false
        description: Name (or company) of the account
      - in: query
        name: filters[username]
        schema:
          type: string
        required: false
        description: Username
      - in: query
        name: filters[email]
        schema:
          type: string
        required: false
        description: Email of the account
      - in: query
        name: filters[phone]
        schema:
          type: string
        required: false
        description: Phone number of the account
      - in: query
        name: mode
        schema:
          type: string
          enum:
          - brief
          - full
          default: full
        required: false
        description: Defines mode of the data output (brief or full)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-Response'
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/Payment-Required'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Not-Found'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation-Error'
        '429':
          $ref: '#/components/responses/Too-Many-Requests'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
      security:
      - bearerAuth: []
      operationId: getV4Accounts
      x-operation-id-source: derived
  /v4/accounts/{voip_id}:
    get:
      summary: Get Account
      description: Retrieve details of an individual account
      tags:
      - Accounts
      parameters:
      - name: voip_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - in: query
        name: mode
        schema:
          type: string
          enum:
          - brief
          - full
          default: full
        required: false
        description: Defines mode of the data output (brief or full)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/Payment-Required'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Not-Found'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation-Error'
        '429':
          $ref: '#/components/responses/Too-Many-Requests'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
      security:
      - bearerAuth: []
      operationId: getV4AccountsByVoipId
      x-operation-id-source: derived
    patch:
      summary: Update Account
      description: Update setting of the account
      tags:
      - Accounts
      parameters:
      - name: voip_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/Payment-Required'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Not-Found'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation-Error'
        '429':
          $ref: '#/components/responses/Too-Many-Requests'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
      requestBody:
        description: Update setting of the account
        required: true
        content:
          application/json:
            schema:
              title: Account
              type: object
              properties:
                contact:
                  type:
                  - object
                  - 'null'
                  properties:
                    id:
                      type:
                      - integer
                      - 'null'
                      description: Contact ID. Read-only
                    name:
                      type: string
                      description: Name
                    company:
                      type:
                      - string
                      - 'null'
                      maxLength: 70
                      description: Name of the contact's company
                    address:
                      properties:
                        line_1:
                          type: string
                          maxLength: 55
                          description: Address line 1
                        line_2:
                          type:
                          - string
                          - 'null'
                          maxLength: 55
                          description: Address line 2
                        city:
                          type: string
                          maxLength: 40
                          description: City
                        province:
                          type:
                          - string
                          - 'null'
                          maxLength: 40
                          description: Contact province
                        postal_code:
                          type:
                          - string
                          - 'null'
                          maxLength: 40
                          description: Contact postal code
                        country:
                          type: string
                          minLength: 2
                          maxLength: 2
                          description: Country name
                      required:
                      - line_1
                      - city
                      - country
                      description: Contact Address
                    phone:
                      type: string
                      pattern: ^\+?([0-9\-\(\)\s]*)$
                      description: Contact phone number
                    fax:
                      type:
                      - string
                      - 'null'
                      maxLength: 25
                      description: Contact fax number
                    primary_email:
                      type: string
                      maxLength: 100
                      description: Primary email
                    alternate_email:
                      type:
                      - string
                      - 'null'
                      maxLength: 100
                      description: Alternate email
                  required:
                  - name
                  - phone
                  - primary_email
                  description: Contact Objects
                billing_contact:
                  type:
                  - object
                  - 'null'
                  properties:
                    id:
                      type:
                      - integer
                      - 'null'
                      description: Billing contact ID. Read-only
                    name:
                      type: string
                      description: Billing contact name
                    company:
                      type:
                      - string
                      - 'null'
                      maxLength: 70
                      description: Billing contact company
                    address:
                      properties:
                        line_1:
                          type: string
                          maxLength: 55
                          description: Billing contact street address
                        line_2:
                          type:
                          - string
                          - 'null'
                          maxLength: 55
                          description: Billing contact street address 2
                        city:
                          type: string
                          maxLength: 40
                          description: Billing contact city
                        province:
                          type:
                          - string
                          - 'null'
                          maxLength: 40
                          description: Billing contact province
                        postal_code:
                          type:
                          - string
                          - 'null'
                          maxLength: 40
                          description: Billing contact postal code
                        country:
                          type: string
                          minLength: 2
                          maxLength: 2
                          description: Billing contact country
                      required:
                      - line_1
                      - city
                      - country
                      description: Billing contact address
                    phone:
                      type: string
                      pattern: ^\+?([0-9\-\(\)\s]*)$
                      description: Billing contact phone
                    fax:
                      type:
                      - string
                      - 'null'
                      maxLength: 25
                      description: Billing contact fax
                    primary_email:
                      type: string
                      maxLength: 100
                      description: Billing contact email
                    alternate_email:
                      type:
                      - string
                      - 'null'
                      maxLength: 100
                      description: Billing contact alternate email
                  required:
                  - name
                  - phone
                  - primary_email
                  description: Billing Contact Objects
                hold_music:
                  type:
                  - object
                  - 'null'
                  description: Default hold music
                timezone:
                  type:
                  - string
                  - 'null'
                  description: Timezone
                directory_type:
                  type:
                  - string
                  - 'null'
                  enum:
                  - last_name
                  - first_name
                  description: Dial-by-Name Directory Type
                dial_prefix:
                  type:
                  - string
                  - 'null'
                  minLength: 0
                  maxLength: 1
                  description: Prefix for Dialing Out
                call_recording_beep:
                  type:
                  - boolean
                  - 'null'
                  description: Call Recording Beep (Every 15 sec)
                default_voip_phone_id:
                  type:
                  - integer
                  - 'null'
                  minimum: 0
                  description: ID of default extension
                record_all_calls:
                  type:
                  - string
                  - 'null'
                  enum:
                  - none
                  - incoming
                  - outgoing
                  - all
                  - custom
                  description: Call Recording policy
                is_restricted:
                  type:
                  - boolean
                  - 'null'
                  description: Defines if Caller ID of account's extension restricted to the numbers associated with this extension
                features:
                  type:
                  - object
                  - 'null'
                  properties:
                    premium-music:
                      type:
                      - boolean
                      - 'null'
                      description: Access to premium hold music
                    call-recording-300:
                      type:
                      - boolean
                      - 'null'
                      description: Call recordings (300 minutes block)
                    call-recording-1000:
                      type:
                      - boolean
                      - 'null'
                      description: Call recordings (1000 minutes block)
                    call-recording-300-transcribe:
                      type:
                      - boolean
                      - 'null'
                      description: Call recordings with transcription (300 minutes block)
                    call-recording-1000-transcribe:
                      type:
                      - boolean
                      - 'null'
                      description: Call recordings with transcription (1000 minutes block)
                  description: Accounts features
      security:
      - bearerAuth: []
      operationId: patchV4AccountsByVoipId
      x-operation-id-source: derived
  /v4/accounts/{voip_id}/cancellation:
    post:
      summary: Account cancellation
      description: Creates account cancellation request
      tags:
      - Accounts
      parameters:
      - name: voip_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/Payment-Required'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Not-Found'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation-Error'
        '429':
          $ref: '#/components/responses/Too-Many-Requests'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
      requestBody:
        description: Creates account cancellation request
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCancellation'
      security:
      - bearerAuth: []
      operationId: postV4AccountsByVoipIdCancellation
      x-operation-id-source: derived
