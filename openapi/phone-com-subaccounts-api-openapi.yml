openapi: 3.2.0
info:
  title: Phoenix API by Phone.com Subaccounts API
  description: API
  version: 4.6.11
servers:
- url: https://api.phone.com
  description: Main production server
tags:
- name: Subaccounts
  description: This page gives an overview of how to interact with your subaccounts. Subaccounts are the same as master accounts in terms of the functionality Phone.com supports. The main difference is that subaccounts are grouped with their master account for invoicing purposes.
paths:
  /v4/accounts/{voip_id}/subaccounts:
    get:
      summary: List Subaccounts
      description: Get a list of subaccounts for the authenticated user or client
      tags:
      - Subaccounts
      parameters:
      - name: voip_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
        required: false
        description: The number of items to skip before starting to collect the result set
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 25
        required: false
        description: The number of items to return
      - in: query
        name: sort[id]
        description: Sort response
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      - in: query
        name: include_subaccounts
        schema:
          type: integer
          minimum: 0
          default: 0
        required: false
        description: Send "1" if you want to add subaccounts data into output
      - in: query
        name: filters[name]
        schema:
          type: string
        required: false
        description: Name (or company) of the account
      - in: query
        name: filters[username]
        schema:
          type: string
        required: false
        description: Username
      - in: query
        name: filters[email]
        schema:
          type: string
        required: false
        description: Email of the account
      - in: query
        name: filters[phone]
        schema:
          type: string
        required: false
        description: Phone number of the account
      - in: query
        name: mode
        schema:
          type: string
          enum:
          - brief
          - full
          default: full
        required: false
        description: Defines mode of the data output (brief or full)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-Response'
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/Payment-Required'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Not-Found'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation-Error'
        '429':
          $ref: '#/components/responses/Too-Many-Requests'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
      security:
      - bearerAuth: []
      operationId: getV4AccountsByVoipIdSubaccounts
      x-operation-id-source: derived
    post:
      summary: Create Subaccount
      description: Add a subaccount for the authenticated user or client
      tags:
      - Subaccounts
      parameters:
      - name: voip_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/Payment-Required'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Not-Found'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation-Error'
        '429':
          $ref: '#/components/responses/Too-Many-Requests'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
      requestBody:
        description: Add a subaccount for the authenticated user or client
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Account'
      security:
      - bearerAuth: []
      operationId: postV4AccountsByVoipIdSubaccounts
      x-operation-id-source: derived
  /v4/accounts/{voip_id}/subaccounts/verification:
    post:
      summary: Request Verification Code
      description: Request verification code (confimation code will be sent to email, email should match username)
      tags:
      - Subaccounts
      parameters:
      - name: voip_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/Payment-Required'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Not-Found'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation-Error'
        '429':
          $ref: '#/components/responses/Too-Many-Requests'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
      requestBody:
        description: Request verification code (confimation code will be sent to email, email should match username)
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationObject'
      security:
      - bearerAuth: []
      operationId: postV4AccountsByVoipIdSubaccountsVerification
      x-operation-id-source: derived
components:
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              '@error':
                type: object
                properties:
                  '@message':
                    type: string
                  '@httpStatusCode':
                    type: integer
                  '@time':
                    type: string
                  '@code':
                    type: string
                  '@details':
                    type: string
              error:
                type: string
              error_description:
                type: string
    Not-Found:
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              '@error':
                type: object
                properties:
                  '@message':
                    type: string
                  '@httpStatusCode':
                    type: integer
                  '@time':
                    type: string
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              '@error':
                type: object
                properties:
                  '@message':
                    type: string
                  '@httpStatusCode':
                    type: integer
                  '@time':
                    type: string
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            type: object
            properties:
              '@error':
                type: object
                properties:
                  '@message':
                    type: string
                  '@httpStatusCode':
                    type: integer
                  '@time':
                    type: string
                  '@messages':
                    type: array
                    items:
                      type: object
                      properties: {}
    Internal-Server-Error:
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              '@error':
                type: object
                properties:
                  '@message':
                    type: string
                  '@httpStatusCode':
                    type: integer
                  '@time':
                    type: string
                  '@code':
                    type: string
                  '@details':
                    type: string
              error:
                type: string
              error_description:
                type: string
    Validation-Error:
      description: Validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              '@error':
                type: object
                properties:
                  '@message':
                    type: string
                  '@httpStatusCode':
                    type: integer
                  '@time':
                    type: string
                  fields:
                    type: object
    Too-Many-Requests:
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              '@error':
                type: object
                properties:
                  '@message':
                    type: string
                  '@httpStatusCode':
                    type: integer
                  '@time':
                    type: string
                  '@rateLimit':
                    type: object
                    properties:
                      RateLimit-Limit:
                        type: integer
                      RateLimit-Remaining:
                        type: integer
                      RateLimit-Reset:
                        type: integer
                      Retry-After:
                        type: integer
    Bad-Request:
      description: Bad Request
      content:
        application/json:
          schema:
            type: object
            properties:
              '@error':
                type: object
                properties:
                  '@message':
                    type: string
                  '@httpStatusCode':
                    type: integer
                  '@time':
                    type: string
    Payment-Required:
      description: Payment Required
      content:
        application/json:
          schema:
            type: object
            properties:
              '@error':
                type: object
                properties:
                  '@message':
                    type: string
                  '@httpStatusCode':
                    type: integer
                  '@time':
                    type: string
  schemas:
    VerificationObject:
      title: VerificationObject
      type: object
      properties:
        email:
          type: string
          minLength: 1
          description: Email for verification
      required:
      - email
    List-Response:
      type: object
      properties:
        filters:
          type: object
        sort:
          type: object
        total:
          type: integer
          default: 0
        limit:
          type: integer
          default: 25
        offset:
          type: integer
          default: 0
        items:
          type: array
          items:
            type: object
            properties: {}
    Account:
      title: Account
      type: object
      properties:
        username:
          type: string
          description: Username
        password:
          type: string
          description: Password
        verification_email:
          type:
          - string
          - 'null'
          description: Email verification code (if required)
        cc_token:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 32
          description: Credit card token from Credit Card endpoint
        billing_day:
          type:
          - integer
          - 'null'
          minimum: 2
          maximum: 28
          description: Day of account's monthly billing cycle beginning (available for special integrations only)
        agent_id:
          type:
          - integer
          - 'null'
          minimum: 1
          description: Agent ID (available for special integrations only)
        tos_accept_date:
          type:
          - integer
          - 'null'
          minimum: 1760553075
          maximum: 1760643075
          description: Timestamp of acceptance of Terms of Service. It may not be more than 1 day in the past or 1 hour in the future.
        tracking_data:
          type:
          - string
          - 'null'
          minLength: 1
          description: Tracking data (available for special integrations only)
        contact:
          type:
          - object
          - 'null'
          properties:
            id:
              type:
              - integer
              - 'null'
              description: Contact ID. Read-only
            name:
              type: string
              description: Name
            company:
              type:
              - string
              - 'null'
              maxLength: 70
              description: Name of the contact's company
            address:
              properties:
                line_1:
                  type: string
                  maxLength: 55
                  description: Address line 1
                line_2:
                  type:
                  - string
                  - 'null'
                  maxLength: 55
                  description: Address line 2
                city:
                  type: string
                  maxLength: 40
                  description: City
                province:
                  type:
                  - string
                  - 'null'
                  maxLength: 40
                  description: Contact province
                postal_code:
                  type:
                  - string
                  - 'null'
                  maxLength: 40
                  description: Contact postal code
                country:
                  type: string
                  minLength: 2
                  maxLength: 2
                  description: Country name
              required:
              - line_1
              - city
              - country
              description: Contact Address
            phone:
              type: string
              pattern: ^\+?([0-9\-\(\)\s]*)$
              description: Contact phone number
            fax:
              type:
              - string
              - 'null'
              maxLength: 25
              description: Contact fax number
            primary_email:
              type: string
              maxLength: 100
              description: Primary email
            alternate_email:
              type:
              - string
              - 'null'
              maxLength: 100
              description: Alternate email
          required:
          - name
          - phone
          - primary_email
          description: Contact Objects
        billing_contact:
          type:
          - object
          - 'null'
          properties:
            id:
              type:
              - integer
              - 'null'
              description: Billing contact ID. Read-only
            name:
              type: string
              description: Billing contact name
            company:
              type:
              - string
              - 'null'
              maxLength: 70
              description: Billing contact company
            address:
              properties:
                line_1:
                  type: string
                  maxLength: 55
                  description: Billing contact street address
                line_2:
                  type:
                  - string
                  - 'null'
                  maxLength: 55
                  description: Billing contact street address 2
                city:
                  type: string
                  maxLength: 40
                  description: Billing contact city
                province:
                  type:
                  - string
                  - 'null'
                  maxLength: 40
                  description: Billing contact province
                postal_code:
                  type:
                  - string
                  - 'null'
                  maxLength: 40
                  description: Billing contact postal code
                country:
                  type: string
                  minLength: 2
                  maxLength: 2
                  description: Billing contact country
              required:
              - line_1
              - city
              - country
              description: Billing contact address
            phone:
              type: string
              pattern: ^\+?([0-9\-\(\)\s]*)$
              description: Billing contact phone
            fax:
              type:
              - string
              - 'null'
              maxLength: 25
              description: Billing contact fax
            primary_email:
              type: string
              maxLength: 100
              description: Billing contact email
            alternate_email:
              type:
              - string
              - 'null'
              maxLength: 100
              description: Billing contact alternate email
          required:
          - name
          - phone
          - primary_email
          description: Billing Contact Objects
      required:
      - username
      - password
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
