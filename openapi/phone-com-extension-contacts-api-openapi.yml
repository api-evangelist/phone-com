openapi: 3.2.0
info:
  title: Phoenix API by Phone.com Extension Contacts API
  description: API
  version: 4.6.11
servers:
- url: https://api.phone.com
  description: Main production server
tags:
- name: Extension Contacts
  description: Each extension at Phone.com can have an address book with any number of contacts.
paths:
  /v4/accounts/{voip_id}/extensions/{extension_id}/contacts:
    get:
      summary: List Contacts
      description: Show a list of address book contacts.
      tags:
      - Extension Contacts
      parameters:
      - name: voip_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: extension_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
        required: false
        description: The number of items to skip before starting to collect the result set
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 25
        required: false
        description: The number of items to return
      - in: query
        name: sort[id]
        description: Sort response
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      - in: query
        name: include_subaccounts
        schema:
          type: integer
          minimum: 0
          default: 0
        required: false
        description: Send "1" if you want to add subaccounts data into output
      - in: query
        name: filters[name]
        schema:
          type: string
        required: false
        description: Contact name = first name + middle name + last name
      - in: query
        name: filters[group_id]
        schema:
          type: string
        required: false
        description: Group filter
      - in: query
        name: filters[phone]
        schema:
          type: string
        required: false
        description: Phone Number
      - in: query
        name: filters[updated_at]
        schema:
          type: string
        required: false
        description: Filters by update date
      - in: query
        name: filters[include_trashed]
        schema:
          type: string
        required: false
        description: only=deleted contacts; ignore=existing contacts; with=both deleted and existing contacts
      - in: query
        name: filters[duplications]
        schema:
          type: string
        required: false
        description: 'Use this filter to return contacts which have duplications. You can analyze them and resolve duplications the way you want on your side via other contacts endpoints. Possible values:

          intersection - any match (name, email or number)

          name - name is the same

          email - email is the same

          number - phone number is the same

          number-or-email - email and/or number is the same'
      - in: query
        name: filters[deleted_at]
        schema:
          type: string
        required: false
        description: Filters by deletion date. Deleted records will be included automatically
      - in: query
        name: filters[modified_at]
        schema:
          type: string
        required: false
        description: Filters by update or deletion date. Deleted records are not included by default.
      - in: query
        name: mode
        schema:
          type: string
          enum:
          - brief
          - full
          default: full
        required: false
        description: Defines mode of the data output (brief or full)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-Response'
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/Payment-Required'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Not-Found'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation-Error'
        '429':
          $ref: '#/components/responses/Too-Many-Requests'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
      security:
      - bearerAuth: []
      operationId: getV4AccountsByVoipIdExtensionsByExtensionIdContacts
      x-operation-id-source: derived
    post:
      summary: Create Contact
      description: This API lets you add a new address book contact for an extension.
      tags:
      - Extension Contacts
      parameters:
      - name: voip_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: extension_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/Payment-Required'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Not-Found'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation-Error'
        '429':
          $ref: '#/components/responses/Too-Many-Requests'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
      requestBody:
        description: This API lets you add a new address book contact for an extension.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtensionContact'
      security:
      - bearerAuth: []
      operationId: postV4AccountsByVoipIdExtensionsByExtensionIdContacts
      x-operation-id-source: derived
  /v4/accounts/{voip_id}/extensions/{extension_id}/contacts/{id}:
    get:
      summary: Get Contact
      description: Retrieve the details of an address book contact.
      tags:
      - Extension Contacts
      parameters:
      - name: voip_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: extension_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - in: query
        name: mode
        schema:
          type: string
          enum:
          - brief
          - full
          default: full
        required: false
        description: Defines mode of the data output (brief or full)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/Payment-Required'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Not-Found'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
