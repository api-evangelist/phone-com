        '429':
          $ref: '#/components/responses/Too-Many-Requests'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
      security:
      - bearerAuth: []
      operationId: getV4AccountsByVoipIdExtensionsByExtensionIdContactsById
      x-operation-id-source: derived
