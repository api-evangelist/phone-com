openapi: 3.2.0
info:
  title: Phoenix API by Phone.com Fax API
  description: API
  version: 4.6.11
servers:
- url: https://api.phone.com
  description: Main production server
tags:
- name: Fax
  description: Phone.com customers can fax outbound documents via the Control Panel or API; They can also receive incoming fax into one of the Extension mailbox. The Fax API service allows users send a fax, list all fax in the account, change the 'new' status of a fax, download a fax and delete a fax.
paths:
  /v4/accounts/{voip_id}/extensions/{extension_id}/fax:
    get:
      summary: List Fax for extension
      description: Get a list of Fax for extension.
      tags:
      - Fax
      parameters:
      - name: voip_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: extension_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
        required: false
        description: The number of items to skip before starting to collect the result set
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 25
        required: false
        description: The number of items to return
      - in: query
        name: sort[id]
        description: Sort response
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      - in: query
        name: filters[is_new]
        schema:
          type: string
        required: false
        description: List only un-read Fax
      - in: query
        name: filters[from]
        schema:
          type: string
        required: false
        description: 'Caller ID filter, the E.164 phone number from which Fax was sent. Note: you must encode the + as %2B'
      - in: query
        name: filters[to]
        schema:
          type: string
        required: false
        description: Callee ID filter, the E.164 phone number to which Fax was sent. Note you must encode the + as %2B
      - in: query
        name: filters[created_at]
        schema:
          type: string
        required: false
        description: 'Date string representing the UTC time that sms was created. Expected value is UNIX timestamp with operator like "gt" (greater than), "gte" (greater than or equals), "lt" (lesser than), "lte" (lesser than or equals). Example: "gt:1597778180".'
      - in: query
        name: filters[extension]
        schema:
          type: string
        required: false
        description: Extension id where Fax is stored
      - in: query
        name: filters[deleted]
        schema:
          type: string
        required: false
        description: 'Deleted filter: only=Gives only the not deleted messages; with=Gives the messages no matter if they are deleted; ignore=Gives only the soft deleted messages;'
      - in: query
        name: mode
        schema:
          type: string
          enum:
          - brief
          - full
          default: full
        required: false
        description: Defines mode of the data output (brief or full)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-Response'
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/Payment-Required'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Not-Found'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation-Error'
        '429':
          $ref: '#/components/responses/Too-Many-Requests'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
      security:
      - bearerAuth: []
      operationId: getV4AccountsByVoipIdExtensionsByExtensionIdFax
      x-operation-id-source: derived
    post:
      summary: Create Fax for extension
      description: The Create Fax API allows users to send a Fax for extension
      tags:
      - Fax
      parameters:
      - name: voip_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: extension_id
