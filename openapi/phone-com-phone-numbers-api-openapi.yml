openapi: 3.2.0
info:
  title: Phoenix API by Phone.com Phone Numbers API
  description: API
  version: 4.6.11
servers:
- url: https://api.phone.com
  description: Main production server
tags:
- name: Phone Numbers
  description: Your Phone.com account has one or more phone numbers registered to it.
paths:
  /v4/accounts/{voip_id}/extensions/{extension_id}/phone-numbers:
    get:
      summary: List Phone Numbers for extension
      description: Get a list of phone numbers registered to an account and associated with specific extension.
      tags:
      - Phone Numbers
      parameters:
      - name: voip_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: extension_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
        required: false
        description: The number of items to skip before starting to collect the result set
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 25
        required: false
        description: The number of items to return
      - in: query
        name: sort[id]
        description: Sort response
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      - in: query
        name: include_subaccounts
        schema:
          type: integer
          minimum: 0
          default: 0
        required: false
        description: Send "1" if you want to add subaccounts data into output
      - in: query
        name: filters[name]
        schema:
          type: string
        required: false
        description: Name filter
      - in: query
        name: filters[number]
        schema:
          type: string
        required: false
        description: Phone number filter
      - in: query
        name: filters[did]
        schema:
          type: string
        required: false
        description: DID (number) filter
      - in: query
        name: filters[activation_date]
        schema:
          type: string
        required: false
        description: Activation date filter
      - in: query
        name: filters[has_real_route]
        schema:
          type: string
        required: false
        description: 1 for phone numbers with meaningful routes (not just 'disconnect'); 0 for other extensions.
      - in: query
        name: filters[lrdn_numbers]
        schema:
          type: string
        required: false
        description: By default we don't show system LRDN numbers. If you want to get LRDN numbers only, provide "only" as value. If you want to include LRDN numbers, provide "include" as value.
      - in: query
        name: filters[usage]
        schema:
          type: string
        required: false
        description: 'Filters results based onthe way number uses the extension: "voip" (number should use extension in the call handling rules), "sms" (number should use extension as inbox), "any". Works only for extension-level requests.'
      - in: query
        name: filters[name-or-did]
        schema:
          type: string
        required: false
        description: Search by Phone number name or DID (number)
      - in: query
        name: mode
        schema:
          type: string
          enum:
          - brief
          - full
          default: full
        required: false
        description: Defines mode of the data output (brief or full)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-Response'
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/Payment-Required'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Not-Found'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation-Error'
        '429':
          $ref: '#/components/responses/Too-Many-Requests'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
      security:
      - bearerAuth: []
      operationId: getV4AccountsByVoipIdExtensionsByExtensionIdPhoneNumbers
      x-operation-id-source: derived
  /v4/accounts/{voip_id}/extensions/{extension_id}/phone-numbers/{id}:
    get:
      summary: Get Phone Number for extension
      description: Show details of an individual phone number associated with specific extension
      tags:
