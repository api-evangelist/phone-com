components:
  schemas:
    ScheduledRequest:
      title: ScheduledRequest
      type: object
      properties:
        request_uri:
          type: string
          minLength: 0
          maxLength: 1024
          description: Request URI starting with "/v4". For example "/v4/accounts/12345/messages"
        request_method:
          type: string
          minLength: 0
          maxLength: 16
          enum:
          - GET
          - POST
          - PATCH
          - PUT
          - DELETE
          description: HTTP method of the request (GET, POST, etc.)
        request_body:
          type:
          - object
          - 'null'
          default: null
          description: Request body
        notification_email:
          type:
          - string
          - 'null'
          minLength: 0
          maxLength: 256
          default: null
          description: Notification email (if not provided default account's email will be used)
        notification_policy:
          type: integer
          minimum: 0
          maximum: 2
          default: 1
          description: 'Notification policy: 0 - no notifications, 1 - only if request failed, 2 - always.'
        scheduled_at:
          type: integer
          minimum: 0
          description: Request scheduled time (UNIX timestamp). Request will be performed in up to 2 minutes after that time. Up to 400 days from the API call moment.
        comment:
          type: string
          maxLength: 256
          default: ''
          description: Comment (description)
        tag:
          type:
          - string
          - 'null'
          maxLength: 32
          default: null
          description: Technical identifier
      required:
      - request_uri
      - request_method
      - scheduled_at
    List-Response:
      type: object
      properties:
        filters:
          type: object
        sort:
          type: object
        total:
          type: integer
          default: 0
        limit:
          type: integer
          default: 25
        offset:
          type: integer
          default: 0
        items:
          type: array
          items:
            type: object
            properties: {}
  responses:
    Unauthorized:
      description: Unauthorized
      content:
