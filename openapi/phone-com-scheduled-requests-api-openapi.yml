        name: filters[processed_at]
        schema:
          type: string
        required: false
        description: 'Processed time filter. Expected value is UNIX timestamp with operator like "gt" (greater than), "gte" (greater than or equals), "lt" (lesser than), "lte" (lesser than or equals). Example: "gt:1597778180".'
