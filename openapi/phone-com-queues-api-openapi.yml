openapi: 3.2.0
info:
  title: Phoenix API by Phone.com Queues API
  description: API
  version: 4.6.11
servers:
- url: https://api.phone.com
  description: Main production server
tags:
- name: Queues
  description: Queues are used when you want to direct calls to a pool of phone numbers and/or extensions. A common utilization of queues is for Customer Service call centers. When a queue is configured on your phone number, Phone.com will route incoming calls to members of the queue. If a queue member is already on another call, our service rings the next phone number or extension in the queue. While your callers are waiting to be connected, you can choose to play Hold Music.
paths:
  /v4/accounts/{voip_id}/queues:
    post:
      summary: Create Queue
      description: Create a queue
      tags:
      - Queues
      parameters:
      - name: voip_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/Payment-Required'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Not-Found'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation-Error'
        '429':
          $ref: '#/components/responses/Too-Many-Requests'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
      requestBody:
        description: Create a queue
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Queue'
      security:
      - bearerAuth: []
      operationId: postV4AccountsByVoipIdQueues
      x-operation-id-source: derived
    get:
      summary: List Queues
      description: Get a list of queues for an account
      tags:
      - Queues
      parameters:
      - name: voip_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
        required: false
        description: The number of items to skip before starting to collect the result set
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 25
        required: false
        description: The number of items to return
      - in: query
        name: sort[id]
        description: Sort response
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      - in: query
        name: include_subaccounts
        schema:
          type: integer
          minimum: 0
          default: 0
        required: false
        description: Send "1" if you want to add subaccounts data into output
      - in: query
        name: filters[name]
        schema:
          type: string
        required: false
        description: Name filter
      - in: query
        name: filters[in_use]
        schema:
          type: string
        required: false
        description: Send '1' if you want to be returned only queues that are used by a route, '0' for not used by any route.
      - in: query
        name: mode
        schema:
          type: string
          enum:
          - brief
          - full
          default: full
        required: false
        description: Defines mode of the data output (brief or full)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-Response'
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/Payment-Required'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Not-Found'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation-Error'
        '429':
          $ref: '#/components/responses/Too-Many-Requests'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
      security:
      - bearerAuth: []
      operationId: getV4AccountsByVoipIdQueues
      x-operation-id-source: derived
  /v4/accounts/{voip_id}/queues/{id}:
    get:
      summary: Get Queue
      description: Show details of an individual queue
      tags:
      - Queues
