              '@error':
                type: object
                properties:
                  '@message':
                    type: string
                  '@httpStatusCode':
                    type: integer
                  '@time':
                    type: string
                  '@code':
                    type: string
                  '@details':
                    type: string
              error:
                type: string
              error_description:
                type: string
    Not-Found:
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              '@error':
                type: object
                properties:
                  '@message':
                    type: string
                  '@httpStatusCode':
                    type: integer
                  '@time':
                    type: string
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              '@error':
                type: object
                properties:
                  '@message':
                    type: string
                  '@httpStatusCode':
                    type: integer
                  '@time':
                    type: string
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            type: object
            properties:
              '@error':
                type: object
                properties:
                  '@message':
                    type: string
                  '@httpStatusCode':
                    type: integer
                  '@time':
                    type: string
                  '@messages':
                    type: array
                    items:
                      type: object
                      properties: {}
    Internal-Server-Error:
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              '@error':
                type: object
                properties:
                  '@message':
                    type: string
                  '@httpStatusCode':
                    type: integer
                  '@time':
                    type: string
                  '@code':
                    type: string
                  '@details':
                    type: string
              error:
                type: string
              error_description:
                type: string
    Validation-Error:
      description: Validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              '@error':
                type: object
                properties:
                  '@message':
                    type: string
                  '@httpStatusCode':
                    type: integer
                  '@time':
                    type: string
                  fields:
                    type: object
    Too-Many-Requests:
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              '@error':
                type: object
                properties:
                  '@message':
                    type: string
                  '@httpStatusCode':
                    type: integer
                  '@time':
                    type: string
                  '@rateLimit':
                    type: object
                    properties:
                      RateLimit-Limit:
                        type: integer
                      RateLimit-Remaining:
                        type: integer
                      RateLimit-Reset:
                        type: integer
                      Retry-After:
                        type: integer
    Bad-Request:
      description: Bad Request
      content:
        application/json:
          schema:
            type: object
            properties:
              '@error':
                type: object
                properties:
                  '@message':
                    type: string
                  '@httpStatusCode':
                    type: integer
                  '@time':
                    type: string
    Payment-Required:
      description: Payment Required
      content:
        application/json:
          schema:
            type: object
            properties:
              '@error':
                type: object
                properties:
                  '@message':
                    type: string
                  '@httpStatusCode':
                    type: integer
                  '@time':
                    type: string
  schemas:
    Trunk:
      title: Trunk
      type: object
      properties:
        name:
          type: string
          description: Name of Trunk
        uri:
          pattern: ^SIP(.+)@(.+)$
          description: URI of Trunk (in the form of SIP/user@host.com:port)
        max_concurrent_calls:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Max concurrent calls. Default is 10
        max_minutes_per_month:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Max minutes per month. Default is 750.
        max_call_duration:
          type:
          - integer
          - 'null'
          minimum: 10
          maximum: 131000
          description: Max call duration. Default is 10800
        codecs:
          type:
          - array
          - 'null'
          items:
            enum:
            - g711u 64k
            - g711u 56k
            - g711a 64k
            - g711a 56k
            - g7231
            - g728
            - g729
            - g729A
            - g729B
            - g729AB
            - gms full
            - rfc2833
            - t38
            - ilbc
            - h263
            - g722
            - g722_1
            - g729D
            - g729E
            - amr
            - amr_wb
            - efr
            - evrc
            - h264
            - mpeg4
            - red
            - cng
            - SIP Info to 2833
          description: Custom audio codec configuration
      required:
      - name
      - uri
    List-Response:
      type: object
      properties:
        filters:
          type: object
        sort:
          type: object
        total:
          type: integer
          default: 0
        limit:
          type: integer
          default: 25
        offset:
          type: integer
          default: 0
        items:
          type: array
          items:
            type: object
            properties: {}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
