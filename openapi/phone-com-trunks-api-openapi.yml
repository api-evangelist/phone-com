        '429':
          $ref: '#/components/responses/Too-Many-Requests'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
      requestBody:
        description: Replace parameters on an individual trunk, only provided parameters will be replaced.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Trunk'
      security:
      - bearerAuth: []
      operationId: patchV4AccountsByVoipIdTrunksById
      x-operation-id-source: derived
    delete:
      summary: Delete Trunk
      description: Delete a trunk from account
      tags:
      - Trunks
      parameters:
      - name: voip_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - in: query
        name: force
        schema:
          type: integer
          enum:
          - 0
          - 1
          default: 0
        required: false
        description: Allows to delete record without validating object's usage (force=1)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
