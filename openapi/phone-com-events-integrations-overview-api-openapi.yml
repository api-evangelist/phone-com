                    type: string
                  '@messages':
                    type: array
                    items:
                      type: object
                      properties: {}
    Internal-Server-Error:
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              '@error':
                type: object
                properties:
                  '@message':
                    type: string
                  '@httpStatusCode':
                    type: integer
                  '@time':
                    type: string
                  '@code':
                    type: string
                  '@details':
                    type: string
              error:
                type: string
              error_description:
                type: string
    Validation-Error:
      description: Validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              '@error':
                type: object
                properties:
                  '@message':
                    type: string
                  '@httpStatusCode':
                    type: integer
                  '@time':
                    type: string
                  fields:
                    type: object
    Too-Many-Requests:
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              '@error':
                type: object
                properties:
                  '@message':
                    type: string
                  '@httpStatusCode':
                    type: integer
                  '@time':
                    type: string
                  '@rateLimit':
                    type: object
                    properties:
                      RateLimit-Limit:
                        type: integer
                      RateLimit-Remaining:
                        type: integer
                      RateLimit-Reset:
                        type: integer
                      Retry-After:
                        type: integer
    Bad-Request:
      description: Bad Request
      content:
        application/json:
          schema:
            type: object
            properties:
              '@error':
                type: object
                properties:
                  '@message':
                    type: string
                  '@httpStatusCode':
                    type: integer
                  '@time':
                    type: string
    Payment-Required:
      description: Payment Required
      content:
        application/json:
          schema:
            type: object
            properties:
              '@error':
                type: object
                properties:
                  '@message':
                    type: string
                  '@httpStatusCode':
                    type: integer
                  '@time':
                    type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
