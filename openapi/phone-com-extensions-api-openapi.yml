openapi: 3.2.0
info:
  title: Phoenix API by Phone.com Extensions API
  description: API
  version: 4.6.11
servers:
- url: https://api.phone.com
  description: Main production server
tags:
- name: Extensions
  description: Your Phone.com account will have one or more extensions.
paths:
  /v4/accounts/{voip_id}/extensions:
    get:
      summary: List Extensions
      description: Get a list of detailed extension information visible to the authenticated user or client.
      tags:
      - Extensions
      parameters:
      - name: voip_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
        required: false
        description: The number of items to skip before starting to collect the result set
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 25
        required: false
        description: The number of items to return
      - in: query
        name: sort[id]
        description: Sort response
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      - in: query
        name: include_subaccounts
        schema:
          type: integer
          minimum: 0
          default: 0
        required: false
        description: Send "1" if you want to add subaccounts data into output
      - in: query
        name: filters[extension]
        schema:
          type: string
        required: false
        description: Extension filter
      - in: query
        name: filters[name]
        schema:
          type: string
        required: false
        description: Name filter
      - in: query
        name: filters[full_name]
        schema:
          type: string
        required: false
        description: Full Name filter
      - in: query
        name: filters[virtual]
        schema:
          type: string
        required: false
        description: 1 for virtual extensions; 0 for non-virtual extensions.
      - in: query
        name: filters[has_real_route]
        schema:
          type: string
        required: false
        description: 1 for extensions with meaningful routes (not just 'disconnect') or attached to devices (non-virtual); 0 for other extensions.
      - in: query
        name: filters[eligible_for_device]
        schema:
          type: string
        required: false
        description: Eligibility to be used with device. 1 for extensions which can be used with device; 0 for extensions which can't.
      - in: query
        name: filters[role]
        schema:
          type: string
        required: false
        description: 'Extension role. Available values: ''device'', ''virtual'', ''company-inbox'', ''nxt-user'', ''common-area'', ''app'', ''softphone'''
      - in: query
        name: filters[nxt_extensions]
        schema:
          type: string
        required: false
        description: Define generation of extensions to be returned. 1 for NXT extensions, 0 for classic extensions.
      - in: query
        name: filters[name-or-extension]
        schema:
          type: string
        required: false
        description: Name or Extension filter
      - in: query
        name: mode
        schema:
          type: string
          enum:
          - brief
          - full
          default: full
        required: false
        description: Defines mode of the data output (brief or full)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-Response'
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/Payment-Required'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Not-Found'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation-Error'
        '429':
          $ref: '#/components/responses/Too-Many-Requests'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
      security:
      - bearerAuth: []
      operationId: getV4AccountsByVoipIdExtensions
      x-operation-id-source: derived
    post:
      summary: Create Extension
      description: Create an individual extension.
      tags:
      - Extensions
      parameters:
      - name: voip_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/Payment-Required'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Not-Found'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation-Error'
        '429':
          $ref: '#/components/responses/Too-Many-Requests'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
      requestBody:
        description: Create an individual extension.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Extension'
      security:
      - bearerAuth: []
      operationId: postV4AccountsByVoipIdExtensions
      x-operation-id-source: derived
  /v4/accounts/{voip_id}/extensions/{extension_id}:
    get:
      summary: Get Extension
      description: Show details of an individual extension.
      tags:
      - Extensions
      parameters:
      - name: voip_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: extension_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - in: query
        name: mode
        schema:
          type: string
          enum:
          - brief
          - full
          default: full
        required: false
        description: Defines mode of the data output (brief or full)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/Payment-Required'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Not-Found'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation-Error'
        '429':
          $ref: '#/components/responses/Too-Many-Requests'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
      security:
      - bearerAuth: []
      operationId: getV4AccountsByVoipIdExtensionsByExtensionId
      x-operation-id-source: derived
    put:
      summary: Replace Extension
      description: Replace parameters on an individual extension, any missing parameters will be replaced with default values.
      tags:
      - Extensions
      parameters:
      - name: voip_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: extension_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/Payment-Required'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Not-Found'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation-Error'
        '429':
          $ref: '#/components/responses/Too-Many-Requests'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
      requestBody:
        description: Replace parameters on an individual extension, any missing parameters will be replaced with default values.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Extension'
      security:
      - bearerAuth: []
      operationId: putV4AccountsByVoipIdExtensionsByExtensionId
      x-operation-id-source: derived
    patch:
      summary: Patch Extension
      description: Replace parameters on an individual extension, only provided parameters will be replaced.
      tags:
      - Extensions
      parameters:
      - name: voip_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: extension_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/Payment-Required'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Not-Found'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation-Error'
        '429':
          $ref: '#/components/responses/Too-Many-Requests'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
      requestBody:
        description: Replace parameters on an individual extension, only provided parameters will be replaced.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Extension'
      security:
      - bearerAuth: []
      operationId: patchV4AccountsByVoipIdExtensionsByExtensionId
      x-operation-id-source: derived
    delete:
      summary: Delete Extension
      description: Delete an individual extension.
      tags:
      - Extensions
      parameters:
      - name: voip_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: extension_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - in: query
        name: force
        schema:
          type: integer
          enum:
          - 0
          - 1
          default: 0
        required: false
        description: Allows to delete record without validating object's usage (force=1)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
