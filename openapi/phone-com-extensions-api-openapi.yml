      operationId: deleteV4AccountsByVoipIdExtensionsByExtensionId
      x-operation-id-source: derived
  /v4/accounts/{voip_id}/extensions/{extension_id}/extensions:
    get:
      summary: List Extensions for extension
      description: Allows extension user to receive list of extensions on account without exposing sensitive information like voicemail PINs, etc.
      tags:
      - Extensions
      parameters:
      - name: voip_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: extension_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - in: query
        name: mode
        schema:
          type: string
          enum:
          - brief
          - full
          default: full
        required: false
        description: Defines mode of the data output (brief or full)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-Response'
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
