openapi: 3.2.0
info:
  title: Phoenix API by Phone.com Live Answer API
  description: API
  version: 4.6.11
servers:
- url: https://api.phone.com
  description: Main production server
tags:
- name: Live Answer
  description: With Live Receptionist and Phone.com, your business can now have its very own live answering service, adding versatility, flexibility, and availability to your company no matter the size.
paths:
  /v4/accounts/{voip_id}/live-answer:
    get:
      summary: List Live Answer Scripts
      description: Returns list of live answer scripts
      tags:
      - Live Answer
      parameters:
      - name: voip_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
        required: false
        description: The number of items to skip before starting to collect the result set
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 25
        required: false
        description: The number of items to return
      - in: query
        name: sort[id]
        description: Sort response
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      - in: query
        name: include_subaccounts
        schema:
          type: integer
          minimum: 0
          default: 0
        required: false
        description: Send "1" if you want to add subaccounts data into output
      - in: query
        name: filters[name]
        schema:
          type: string
        required: false
        description: Name filter
      - in: query
        name: filters[enabled]
        schema:
          type: string
        required: false
        description: Send '1' if you want to be returned only scripts that are active, '0' for deactivated scripts.
      - in: query
        name: filters[vendor_id]
        schema:
          type: string
        required: false
        description: Vendor ID
      - in: query
        name: mode
        schema:
          type: string
          enum:
          - brief
          - full
          default: full
        required: false
        description: Defines mode of the data output (brief or full)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-Response'
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/Payment-Required'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Not-Found'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation-Error'
        '429':
          $ref: '#/components/responses/Too-Many-Requests'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
      security:
      - bearerAuth: []
      operationId: getV4AccountsByVoipIdLiveAnswer
      x-operation-id-source: derived
    post:
      summary: Create Live Answer Script
      description: Add a live answer script to your account
      tags:
      - Live Answer
      parameters:
      - name: voip_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/Payment-Required'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Not-Found'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation-Error'
        '429':
          $ref: '#/components/responses/Too-Many-Requests'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
      requestBody:
        description: Add a live answer script to your account
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiveAnswer'
      security:
      - bearerAuth: []
      operationId: postV4AccountsByVoipIdLiveAnswer
      x-operation-id-source: derived
  /v4/accounts/{voip_id}/live-answer/{id}:
    get:
      summary: Get Live Answer Script
      description: Get an individual live answer script
      tags:
      - Live Answer
      parameters:
      - name: voip_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - in: query
        name: mode
        schema:
          type: string
          enum:
          - brief
          - full
          default: full
        required: false
        description: Defines mode of the data output (brief or full)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/Payment-Required'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Not-Found'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation-Error'
        '429':
          $ref: '#/components/responses/Too-Many-Requests'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
      security:
      - bearerAuth: []
      operationId: getV4AccountsByVoipIdLiveAnswerById
      x-operation-id-source: derived
    delete:
      summary: Delete Live Answer
      description: Delete an individual live answer
      tags:
      - Live Answer
      parameters:
      - name: voip_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - in: query
        name: force
        schema:
          type: integer
          enum:
          - 0
          - 1
          default: 0
        required: false
        description: Allows to delete record without validating object's usage (force=1)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/Payment-Required'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Not-Found'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation-Error'
        '429':
          $ref: '#/components/responses/Too-Many-Requests'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
      security:
      - bearerAuth: []
      operationId: deleteV4AccountsByVoipIdLiveAnswerById
      x-operation-id-source: derived
    patch:
      summary: Patch Live Answer
      description: Replace parameters on an individual live answer script, only provided partamteres will be replaced
      tags:
      - Live Answer
      parameters:
      - name: voip_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/Payment-Required'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Not-Found'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation-Error'
        '429':
          $ref: '#/components/responses/Too-Many-Requests'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
      requestBody:
        description: Replace parameters on an individual live answer script, only provided partamteres will be replaced
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiveAnswer'
      security:
      - bearerAuth: []
      operationId: patchV4AccountsByVoipIdLiveAnswerById
      x-operation-id-source: derived
