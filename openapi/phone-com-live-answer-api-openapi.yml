  schemas:
    LiveAnswer:
      title: LiveAnswer
      type: object
      properties:
        code:
          type: integer
          minimum: 1
          description: Live answer plan associated with the script
        name:
          type: string
          description: Name of live answer script
        business_name:
          type:
          - string
          - 'null'
          maxLength: 255
          description: Business name
        business_description:
          type:
          - string
          - 'null'
          description: Description of your business
        greeting:
          type:
          - string
          - 'null'
          maxLength: 256
          description: Greeting of live answer, ex. 'Guten tag! You reached American office of Bratwurst GmBH'
        call_handling_notes:
          type:
          - string
          - 'null'
          maxLength: 4096
          description: Call handling notes for the whole resource
        enabled:
          type:
          - boolean
          - 'null'
          description: Status
        appointments_enabled:
          type:
          - boolean
          - 'null'
          description: Wheather your business should accept appointments
        appointments_description:
          type:
          - string
          - 'null'
          maxLength: 4096
          description: Description of appointments policy
        business_contact:
          type: object
          properties:
