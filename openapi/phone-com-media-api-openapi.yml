          application/json:
            schema:
              $ref: '#/components/schemas/Recording'
      security:
      - bearerAuth: []
      operationId: postV4AccountsByVoipIdExtensionsByExtensionIdMedia
      x-operation-id-source: derived
    get:
      summary: List Media for extension
      description: Get a list of media recordings for extension
      tags:
      - Media
