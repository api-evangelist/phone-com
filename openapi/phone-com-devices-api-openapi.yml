openapi: 3.2.0
info:
  title: Phoenix API by Phone.com Devices API
  description: API
  version: 4.6.11
servers:
- url: https://api.phone.com
  description: Main production server
tags:
- name: Devices
  description: 'Extension on your Phone.com account may have SIP devices associated with them.


    The Device API provides information about those SIP devices, such as the SIP credentials required.'
paths:
  /v4/accounts/{voip_id}/devices:
    post:
      summary: Create device
      description: 'The Create Device API allows you to add a Generic SIP device. You may use the extension API to associate the device with the extension, which is required for the device to be operational. NOTE: If you use the Create Device and at the same request, ask to associate the device to an extension (using the "Lines" Param). The Call Handling Rules (CHR) of the Extension, if existed, will be deleted.


        To ensure proper operation of the SIP device, you must add some call handling rules to the extension. Adding CHR is usually done by using the extension API.'
      tags:
      - Devices
      parameters:
      - name: voip_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/Payment-Required'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Not-Found'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation-Error'
        '429':
          $ref: '#/components/responses/Too-Many-Requests'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
      requestBody:
        description: "The Create Device API allows you to add a Generic SIP device. You may use the extension API to associate the device with the extension, which is required for the device to be operational.  NOTE: If you use the Create Device and at the same request, ask to associate the device to an extension (using the \"Lines\" Param). The Call Handling Rules (CHR) of the Extension, if existed, will be deleted. \n\nTo ensure proper operation of the SIP device, you must add some call handling rules to the extension. Adding CHR is usually done by using the extension API."
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Device'
      security:
      - bearerAuth: []
      operationId: postV4AccountsByVoipIdDevices
      x-operation-id-source: derived
    get:
      summary: List Devices
      description: Get a list of VoIP devices associated with your account
      tags:
      - Devices
      parameters:
      - name: voip_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
        required: false
        description: The number of items to skip before starting to collect the result set
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 25
        required: false
        description: The number of items to return
      - in: query
        name: sort[id]
        description: Sort response
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      - in: query
        name: include_subaccounts
        schema:
          type: integer
          minimum: 0
          default: 0
        required: false
        description: Send "1" if you want to add subaccounts data into output
      - in: query
        name: filters[name]
        schema:
          type: string
        required: false
        description: Name filter
      - in: query
        name: filters[type]
        schema:
          type: string
        required: false
        description: 'Device type filter, array or string. Available values: other, generic, softphone, iphone, communicator'
      - in: query
        name: filters[sip_username]
        schema:
          type: string
        required: false
        description: SIP username filter
      - in: query
        name: filters[extension_name]
        schema:
          type: string
        required: false
        description: Extension name
      - in: query
        name: filters[extension_number]
        schema:
          type: string
        required: false
        description: Extension number
      - in: query
        name: filters[mac_address]
        schema:
          type: string
        required: false
        description: MAC address
      - in: query
        name: filters[serial_number]
        schema:
          type: string
        required: false
        description: Serial number
      - in: query
        name: mode
        schema:
          type: string
          enum:
          - brief
          - full
          default: full
        required: false
        description: Defines mode of the data output (brief or full)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-Response'
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/Payment-Required'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Not-Found'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation-Error'
        '429':
          $ref: '#/components/responses/Too-Many-Requests'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
      security:
      - bearerAuth: []
      operationId: getV4AccountsByVoipIdDevices
      x-operation-id-source: derived
