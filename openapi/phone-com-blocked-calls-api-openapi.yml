        '500':
          $ref: '#/components/responses/Internal-Server-Error'
      requestBody:
        description: Create a blocked call pattern
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoipBlacklist'
      security:
      - bearerAuth: []
      operationId: postV4AccountsByVoipIdBlockedCalls
      x-operation-id-source: derived
    get:
      summary: List Blocked Calls
      description: Get a list of pattern used to block incoming or outgoing calls
      tags:
      - Blocked Calls
      parameters:
      - name: voip_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
        required: false
        description: The number of items to skip before starting to collect the result set
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 25
        required: false
        description: The number of items to return
      - in: query
        name: sort[id]
        description: Sort response
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      - in: query
        name: include_subaccounts
        schema:
          type: integer
          minimum: 0
          default: 0
        required: false
        description: Send "1" if you want to add subaccounts data into output
      - in: query
        name: filters[type]
        schema:
          type: string
        required: false
        description: Type of blocked call - 'incoming' or 'outgoing'
      - in: query
        name: filters[pattern_type]
        schema:
          type: string
        required: false
        description: Type of pattern - 'equals' or 'starts_with'
      - in: query
        name: filters[pattern]
        schema:
          type: string
        required: false
        description: Pattern of phone number. Starts with '+', followed by digits up to 14 characters
      - in: query
        name: filters[number]
        schema:
          type: string
        required: false
        description: Phone number for being tested by patterns (matched patterns will be returned)
      - in: query
        name: mode
        schema:
          type: string
          enum:
          - brief
          - full
          default: full
        required: false
        description: Defines mode of the data output (brief or full)
      responses:
        '200':
          description: OK
