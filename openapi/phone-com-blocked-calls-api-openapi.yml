components:
  schemas:
    VoipBlacklist:
      title: VoipBlacklist
      type: object
      properties:
        start_date:
          type: integer
          minimum: 0
          description: Timestamp in UNIX format
        type:
          type: string
          enum:
          - incoming
          - outgoing
          description: Can be 'incoming', 'outgoing'
        pattern_type:
          type: string
          enum:
          - equals
          - starts_with
          description: Can be 'equals', 'starts_with'
        pattern:
          type: string
          minLength: 1
          maxLength: 14
          pattern: \+[0-9]+
          description: Pattern of phone number. Starts with '+', followed by digits up to 14 characters
        notes:
          type: string
          minLength: 0
          maxLength: 80
          description: Notes of black list, up to 80 characters
      required:
      - pattern
    List-Response:
      type: object
      properties:
        filters:
          type: object
        sort:
          type: object
        total:
          type: integer
          default: 0
        limit:
          type: integer
          default: 25
        offset:
          type: integer
          default: 0
        items:
          type: array
          items:
            type: object
            properties: {}
