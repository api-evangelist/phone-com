info:
  title: Phoenix API by Phone.com Blocked Calls API
  description: API
  version: 4.6.11
servers:
- url: https://api.phone.com
  description: Main production server
tags:
- name: Blocked Calls
  description: The Blocked Calls API allows users block incoming calls from specific phone numbers. If only a part of a telephone number is provided, calls with callers ID matching the pattern will be blocked. For example, pattern '+1212' will block all calls from NY 212 area code.
paths:
  /v4/accounts/{voip_id}/blocked-calls:
    post:
      summary: Create Blocked Call
      description: Create a blocked call pattern
      tags:
      - Blocked Calls
      parameters:
      - name: voip_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
