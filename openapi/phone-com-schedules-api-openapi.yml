openapi: 3.2.0
info:
  title: Phoenix API by Phone.com Schedules API
  description: API
  version: 4.6.11
servers:
- url: https://api.phone.com
  description: Main production server
tags:
- name: Schedules
  description: Schedules are used at various places in your Phone.com account. A schedule can specify a recurring weekly pattern such as 'Monday through Friday' or a single time period such as 'Thanksgiving Weekend 2015'.
paths:
  /v4/accounts/{voip_id}/schedules:
    get:
      summary: List Schedules
      description: Get a list of schedules for an account
      tags:
      - Schedules
      parameters:
      - name: voip_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
        required: false
        description: The number of items to skip before starting to collect the result set
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 25
        required: false
        description: The number of items to return
      - in: query
        name: sort[id]
        description: Sort response
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      - in: query
        name: include_subaccounts
        schema:
          type: integer
          minimum: 0
          default: 0
        required: false
        description: Send "1" if you want to add subaccounts data into output
      - in: query
        name: filters[name]
        schema:
          type: string
        required: false
        description: Name filter
      - in: query
        name: mode
        schema:
          type: string
          enum:
          - brief
          - full
          default: full
        required: false
        description: Defines mode of the data output (brief or full)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/List-Response'
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/Payment-Required'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Not-Found'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation-Error'
        '429':
          $ref: '#/components/responses/Too-Many-Requests'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
      security:
      - bearerAuth: []
      operationId: getV4AccountsByVoipIdSchedules
      x-operation-id-source: derived
    post:
      summary: Create Schedule
      description: Create a schedule for an account
      tags:
      - Schedules
      parameters:
      - name: voip_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/Payment-Required'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Not-Found'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation-Error'
        '429':
          $ref: '#/components/responses/Too-Many-Requests'
        '500':
          $ref: '#/components/responses/Internal-Server-Error'
      requestBody:
        description: Create a schedule for an account
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Schedule'
      security:
      - bearerAuth: []
      operationId: postV4AccountsByVoipIdSchedules
      x-operation-id-source: derived
  /v4/accounts/{voip_id}/schedules/{id}:
    get:
      summary: Get Schedule
      description: Show details of an individual schedule
      tags:
      - Schedules
      parameters:
      - name: voip_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - in: query
        name: mode
        schema:
          type: string
          enum:
          - brief
          - full
          default: full
        required: false
        description: Defines mode of the data output (brief or full)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
