      requestBody:
        description: Replace a schedule
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Schedule'
      security:
      - bearerAuth: []
      operationId: putV4AccountsByVoipIdSchedulesById
      x-operation-id-source: derived
    patch:
      summary: Patch Schedule
      description: Replace parameters on an individual schedule, only provided parameters will be replaced.
      tags:
      - Schedules
      parameters:
      - name: voip_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          $ref: '#/components/responses/Bad-Request'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/Payment-Required'
        '403':
