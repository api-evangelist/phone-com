  schemas:
    Schedule:
      title: Schedule
      type: object
      properties:
        voip_id:
          type:
          - integer
          - 'null'
          minimum: 1
          description: Account ID
        name:
          type: string
          maxLength: 30
          description: Schedule Name
        timezone:
          description: Time zone in IANA time zone database format (like 'America/Los_Angeles')
        items:
          type: array
          items:
            type: object
            properties:
              holiday_id:
                type:
                - integer
                - 'null'
                minimum: 1
                description: Schedule holiday ID
              days_before:
                type:
                - integer
                - 'null'
                minimum: 0
                maximum: 255
                description: Number of days before the holiday
              days_after:
                type:
                - integer
                - 'null'
                minimum: 0
                maximum: 255
                description: Number of days after the holiday
              start_date:
                type:
                - integer
                - 'null'
                minimum: 0
                description: The Scheduled Start Date
              end_date:
                type:
                - integer
                - 'null'
                minimum: 0
                description: The Scheduled End Date
              start_hour:
                type:
                - integer
                - 'null'
                minimum: 0
                maximum: 23
                description: Start hour of schedule
              start_minute:
                type:
                - integer
                - 'null'
                minimum: 0
                maximum: 59
                description: Start minute of schedule
              end_hour:
                type:
                - integer
                - 'null'
                minimum: 0
                maximum: 23
                description: End hour of schedule
              end_minute:
                type:
                - integer
                - 'null'
                minimum: 0
                maximum: 59
                description: End minute of schedule
              day:
                type:
                - string
                - 'null'
                enum:
                - M
                - T
                - W
                - Th
                - F
                - S
                - Su
                description: Schedule day
              use_once:
                type:
                - boolean
                - 'null'
                description: Check schedule if use once
              expiration_date:
                type:
                - integer
                - 'null'
                minimum: 0
                description: Schedule expiration date
          description: Schedule Items
      required:
      - name
      - items
    List-Response:
      type: object
      properties:
        filters:
          type: object
        sort:
          type: object
        total:
          type: integer
          default: 0
        limit:
          type: integer
          default: 25
        offset:
          type: integer
          default: 0
        items:
          type: array
          items:
            type: object
            properties: {}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
